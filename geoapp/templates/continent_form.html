<form method="POST">
  {% csrf_token %}
  {{ form }}
  <button type="submit">Explore</button>
</form>

templates/search_results.html
<h2>Results</h2>
<table>
<tr><th>Country</th><th>Capital</th><th>Population</th><th>Temp (°C)</th><th>Weather</th></tr>
{% for r in results %}
<tr>
  <td>{{ r.country }}</td><td>{{ r.capital }}</td><td>{{ r.population }}</td>
  <td>{{ r.temperature_celsius }}</td><td>{{ r.weather_description }}</td>
</tr>
{% endfor %}
</table>
